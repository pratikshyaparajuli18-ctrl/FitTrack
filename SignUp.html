<!DOCTYPE html>	
<html>
	<head>
		<meta="UTF-8">
		<title>FitTrack - Log In Page</title>
		
		<link href="styles.css" rel="stylesheet" />
		<script src="background/background.js" defer></script>
		
	</head>
	
	<body>
		
		<!-- create the form for submission -->
		<canvas id="background" data-shader="background/wave.glsl"></canvas>
		
		<br></br>
		<form action="ProfileGoals.html" method="POST">
			<fieldset>
				<h1>Sign Up</h1>
				<br></br>
				<label for="username">Username:</label>
				<input type="text" id="username" name="username" required />
				<br></br>
				<label for="password">Password:</label>
				<input type="password" id="password" name="password" required />
				<br></br>
				<br></br>
				<p><a href="SignIn.html">already have an account?</a></p>
				<button type="submit">Sign Up</button>
			</fieldset>
		</form>
	</body>
	
</html>
