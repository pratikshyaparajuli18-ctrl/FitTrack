<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FitTrack</title>

    <link rel="stylesheet" href="/frontend/styles.css" />

    <script src="/background/background.js" defer></script>
    <script src="/frontend/home/index.js" defer></script>
  </head>
  <body>
    <canvas id="background" data-shader="/background/wave.glsl"></canvas>

    <div class="page">
      <header class="banner">
        <nav class="menu">
          <a href="/frontend/home/">Home</a>
          <a href="/frontend/home/plans.html">Plans</a>
          <a href="#contact">Contact</a>

          <a class="login" href="/frontend/signin-up/SignIn.html">Login</a>
          <a class="signup" href="/frontend/signin-up/SignUp.html">Sign Up</a>
        </nav>
      </header>

      <main class="layout" id="main">
        <!-- Workout buttons made from workouts.json -->
        <nav class="left-pane"></nav>

        <section class="right-pane">
          <div class="info">
            <h1 id="workout-name">Loading workouts</h1>
            <p id="workout-info" role="status"></p>
          </div>

          <!-- Get the exercises that belong to the workout -->
          <nav class="exercise-list" id="exercise-list"></nav>

          <section class="exercise-info">
            <h2 id="exercise-name"></h2>
            <p id="exercise-info"></p>
          </section>

          <!-- Image buttons are made from selected exercise -->
          <nav class="images"></nav>

          <section class="media">
            <div class="main-image" id="current-image"></div>
          </section>
        </section>
      </main>
    </div>

    <footer class="contact-footer" id="contact">
      <h2>Contact FitTrack</h2>
      <p>Have a question or suggestion? Get in touch.</p>
      <a href="mailto:contact@example.com">contact@example.com</a>
    </footer>
  </body>
</html>
