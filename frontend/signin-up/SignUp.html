<!DOCTYPE html>	
<html>
	<head>
		<meta="UTF-8">
		<title>FitTrack - Log In Page</title>
		
		<link href="/frontend/styles.css" rel="stylesheet" />
		<script src="/background/background.js" defer></script>
		
	</head>
	
	<body>
		
		<!-- create the form for submission -->
		<canvas id="background" data-shader="/background/wave.glsl"></canvas>
		
    <header class="banner">
      <nav class="menu">
        <a href="/frontend/home/">Home</a>
        <a href="/frontend/home/plans.html">Plans</a>
        <a href="#contact">Contact</a>

          <div class="account-links">
            <a href="/frontend/signin-up/SignIn.html">Login</a>
            <a href="/frontend/signin-up/SignUp.html">Sign Up</a>
          </div>
      </nav>
    </header>

		<form action="ProfileGoals.html">
			<fieldset>
				<h1>Sign Up</h1>
				<br></br>
				<label for="username">Username:</label>
				<input type="text" id="username" name="username"  minlength="8" required />
				<br></br>
				<label for="password">Password:</label>
				<input type="password" id="password" name="password" minlength="12" required />
				<br></br>
				<br></br>
				<p><a href="SignIn.html">already have an account?</a></p>
				<button type="submit">Sign Up</button>
			</fieldset>
		</form>

    <footer class="contact-footer" id="contact">
      <h2>Contact FitTrack</h2>
      <p>Have a question or suggestion? Get in touch.</p>
      <a href="mailto:contact@example.com">contact@example.com</a>
    </footer>
	</body>
	
</html>
