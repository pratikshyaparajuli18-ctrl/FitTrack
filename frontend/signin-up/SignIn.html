<!DOCTYPE html>	
<html>
	<head>
		<meta="UTF-8">
		<title>FitTrack - Log In Page</title>
		
		<link href="/frontend/styles.css" rel="stylesheet" />
		<script src="/background/background.js" defer></script>
		
	</head>
	
	<body>
		
		<canvas id="background" data-shader="/background/wave.glsl"></canvas>

    <header class="banner">
      <nav class="menu">
        <a href="/frontend/home/">Home</a>
        <a href="/frontend/home/plans.html">Plans</a>
        <a href="#contact">Contact</a>

        <a class="login" href="/frontend/signin-up/SignIn.html">Login</a>
        <a class="signup" href="/frontend/signin-up/SignUp.html">Sign Up</a>
      </nav>
    </header>
		
		<form>
			<fieldset>
				<h1>Log In</h1>
				<br></br>
				<label for="username">Username:</label>
				<input type="text" id="username" name="username" required />
				<br></br>
				<label for="password">Password:</label>
				<input type="password" id="password" name="password" required />
				<br></br>
				<br></br>
				<p><a href="SignUp.html">don't have an account?</a></p>
				<button type="submit">Log In</button>
			</fieldset>
		</form>

    <footer class="contact-footer" id="contact">
      <h2>Contact FitTrack</h2>
      <p>Have a question or suggestion? Get in touch.</p>
      <a href="mailto:contact@example.com">contact@example.com</a>
    </footer>
	</body>
	
</html>
